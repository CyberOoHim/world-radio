name: Update AI Seed Embeddings

on:
  push:
    branches: [main]
    paths:
      - 'src/server/seedIndex.ts'
      - 'src/server/seedSync.ts'
      - 'src/server/geoTaxonomy.ts'
      - 'scripts/build-ai-seed.ts'
  workflow_dispatch:
    inputs:
      seed_count:
        description: 'Target SEED_SWEET_SPOT_COUNT override (defaults to repo var or 6000)'
        type: string
        default: ''
      refresh_stations:
        description: 'Re-fetch the full station catalog from Radio Browser before embedding'
        type: boolean
        default: false
      reembed_all:
        description: 'Re-compute all station vectors from scratch'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Compute AI Seed Embeddings
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SEED_SWEET_SPOT_COUNT: ${{ inputs.seed_count || vars.SEED_SWEET_SPOT_COUNT || '' }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "Missing GEMINI_API_KEY repository secret."
              exit 1
            fi
            echo "GEMINI_API_KEY secret is not configured; skipping automatic push seed sync."
            exit 0
          fi
          FLAGS=""
          if [ "${{ inputs.refresh_stations }}" = "true" ]; then
            FLAGS="$FLAGS --refresh"
          fi
          if [ "${{ inputs.reembed_all }}" = "true" ]; then
            FLAGS="$FLAGS --reembed"
          fi
          npm run ai:seed -- $FLAGS

      - name: Commit updated seed index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/station-seed-index.json
          if git diff --cached --quiet; then
            echo "No changes to data/station-seed-index.json"
            exit 0
          fi
          git commit -m "chore: sync AI station seed index and embeddings [skip ci]"
          git push

