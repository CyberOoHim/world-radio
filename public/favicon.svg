<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Retro 8-bit World Radio favicon -->
  <rect width="32" height="32" rx="6" fill="#0c1222"/>
  <!-- rounded frame accents (pixel corners) -->
  <rect x="0" y="4" width="2" height="24" fill="#5a8f86"/>
  <rect x="30" y="4" width="2" height="24" fill="#5a8f86"/>
  <rect x="4" y="0" width="24" height="2" fill="#5a8f86"/>
  <rect x="4" y="30" width="24" height="2" fill="#5a8f86"/>
  <rect x="2" y="2" width="2" height="2" fill="#5a8f86"/>
  <rect x="28" y="2" width="2" height="2" fill="#5a8f86"/>
  <rect x="2" y="28" width="2" height="2" fill="#5a8f86"/>
  <rect x="28" y="28" width="2" height="2" fill="#5a8f86"/>

  <!-- antenna mast -->
  <rect x="9" y="4" width="2" height="7" fill="#8b9cf7"/>
  <rect x="8" y="3" width="4" height="2" fill="#8b9cf7"/>
  <rect x="9" y="2" width="2" height="1" fill="#7dd3c0"/>

  <!-- signal waves (pixel arcs) -->
  <rect x="18" y="5" width="2" height="2" fill="#7dd3c0"/>
  <rect x="20" y="4" width="2" height="2" fill="#7dd3c0"/>
  <rect x="22" y="5" width="2" height="2" fill="#7dd3c0"/>
  <rect x="24" y="7" width="2" height="2" fill="#8b9cf7"/>
  <rect x="25" y="9" width="2" height="2" fill="#8b9cf7"/>
  <rect x="20" y="7" width="2" height="2" fill="#7dd3c0"/>
  <rect x="22" y="8" width="2" height="2" fill="#7dd3c0"/>
  <rect x="23" y="10" width="2" height="2" fill="#8b9cf7"/>

  <!-- radio body outer (purple) -->
  <rect x="5" y="11" width="22" height="16" fill="#6b5fb5"/>
  <!-- body face -->
  <rect x="6" y="12" width="20" height="14" fill="#121a2e"/>
  <!-- teal left trim -->
  <rect x="6" y="12" width="2" height="14" fill="#7dd3c0"/>
  <!-- purple rim -->
  <rect x="6" y="12" width="20" height="1" fill="#8b9cf7"/>
  <rect x="6" y="25" width="20" height="1" fill="#8b9cf7"/>
  <rect x="24" y="12" width="2" height="14" fill="#8b9cf7"/>

  <!-- speaker grille (coral ring) -->
  <rect x="8" y="15" width="8" height="8" fill="#1a2238"/>
  <rect x="9" y="15" width="6" height="1" fill="#e07a6a"/>
  <rect x="9" y="22" width="6" height="1" fill="#e07a6a"/>
  <rect x="8" y="16" width="1" height="6" fill="#e07a6a"/>
  <rect x="15" y="16" width="1" height="6" fill="#e07a6a"/>
  <rect x="10" y="16" width="1" height="1" fill="#e07a6a"/>
  <rect x="13" y="16" width="1" height="1" fill="#e07a6a"/>
  <rect x="11" y="17" width="2" height="1" fill="#e07a6a"/>
  <rect x="10" y="18" width="1" height="2" fill="#e07a6a"/>
  <rect x="13" y="18" width="1" height="2" fill="#e07a6a"/>
  <rect x="11" y="20" width="2" height="1" fill="#e07a6a"/>
  <rect x="10" y="21" width="1" height="1" fill="#e07a6a"/>
  <rect x="13" y="21" width="1" height="1" fill="#e07a6a"/>
  <rect x="11" y="18" width="2" height="2" fill="#e07a6a"/>

  <!-- cream dial -->
  <rect x="18" y="15" width="6" height="6" fill="#e8c4a0"/>
  <rect x="19" y="14" width="4" height="1" fill="#e8c4a0"/>
  <rect x="19" y="21" width="4" height="1" fill="#e8c4a0"/>
  <rect x="17" y="16" width="1" height="4" fill="#e8c4a0"/>
  <rect x="24" y="16" width="1" height="4" fill="#e8c4a0"/>
  <!-- dial needle -->
  <rect x="20" y="16" width="1" height="3" fill="#e07a6a"/>
  <rect x="21" y="18" width="2" height="1" fill="#e07a6a"/>
  <rect x="20" y="18" width="1" height="1" fill="#c45a4a"/>

  <!-- mini knobs -->
  <rect x="18" y="23" width="2" height="2" fill="#7dd3c0"/>
  <rect x="22" y="23" width="2" height="2" fill="#7dd3c0"/>
</svg>
