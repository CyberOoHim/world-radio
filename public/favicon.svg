<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Midnight Gradient Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#141e36"/>
    </linearGradient>

    <!-- Vibrant High-Visibility Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>

    <!-- Globe Ring Gradient -->
    <linearGradient id="globeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Neon Accent Red/Pink Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Soft Drop Shadow for visibility -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Background Squircle Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Thick Prominent Outer Border (High Visibility) -->
  <rect x="20" y="20" width="472" height="472" rx="92" fill="none" stroke="url(#borderGrad)" stroke-width="28"/>
  <rect x="38" y="38" width="436" height="436" rx="74" fill="none" stroke="#090e1a" stroke-width="8"/>

  <!-- Main Graphic Group -->
  <g filter="url(#shadow)">
    <!-- Radio Antenna Tower Shaft -->
    <line x1="256" y1="184" x2="256" y2="114" stroke="#94a3b8" stroke-width="22" stroke-linecap="round"/>

    <!-- Glowing Red/Pink Antenna Tip Ball -->
    <circle cx="256" cy="100" r="22" fill="url(#accentGrad)"/>

    <!-- Radiating Broadcast Waves (Thick & Bold) -->
    <!-- Inner Waves -->
    <path d="M 196 90 A 64 64 0 0 0 196 110" fill="none" stroke="#38bdf8" stroke-width="24" stroke-linecap="round"/>
    <path d="M 316 90 A 64 64 0 0 1 316 110" fill="none" stroke="#38bdf8" stroke-width="24" stroke-linecap="round"/>

    <!-- Outer Waves -->
    <path d="M 152 64 A 114 114 0 0 0 152 136" fill="none" stroke="#818cf8" stroke-width="24" stroke-linecap="round"/>
    <path d="M 360 64 A 114 114 0 0 1 360 136" fill="none" stroke="#818cf8" stroke-width="24" stroke-linecap="round"/>

    <!-- Globe Sphere (Solid Filled Inner Body + Thick Outline) -->
    <circle cx="256" cy="304" r="118" fill="#0f172a" stroke="url(#globeGrad)" stroke-width="26"/>

    <!-- Globe Grid Lines (High Contrast) -->
    <!-- Equator Line -->
    <line x1="140" y1="304" x2="372" y2="304" stroke="#38bdf8" stroke-width="22"/>

    <!-- Latitude Curve Top -->
    <path d="M 166 250 Q 256 278 346 250" fill="none" stroke="#38bdf8" stroke-width="18" stroke-linecap="round"/>
    <!-- Latitude Curve Bottom -->
    <path d="M 166 358 Q 256 330 346 358" fill="none" stroke="#38bdf8" stroke-width="18" stroke-linecap="round"/>

    <!-- Central Vertical Meridian Ellipse -->
    <ellipse cx="256" cy="304" rx="54" ry="118" fill="none" stroke="#38bdf8" stroke-width="20"/>

    <!-- Center Player Play Button Badge -->
    <circle cx="256" cy="304" r="44" fill="#090e1a" stroke="#38bdf8" stroke-width="12"/>
    <polygon points="246,282 246,326 278,304" fill="#ffffff"/>
  </g>
</svg>
